<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="OCS">
  <title>OCS</title>
  <!-- App mark derived from the Online Creative Solutions badge.
       The source bakes a wordmark into the disc, which is illegible below
       ~48px (verified on a size contact sheet), so this keeps only the three
       elements carrying the identity: the dark disc, the segmented chartreuse
       fan, and the cyan dome. Colours measured from the source artwork.
       Flat rather than glossy: the original's gradient does not survive small
       sizes and fights the panel's otherwise monochrome chrome. -->
  <circle cx="256" cy="256" r="256" fill="#111111"/>
  <g fill="none" stroke="#e6ff38" stroke-linecap="round">
    <path d="M 171.4 346.3 A 88 88 0 1 1 343.5 331.2" stroke-width="26" stroke-dasharray="26 22"/>
    <path d="M 122.1 345.6 A 136 136 0 1 1 389.9 345.6" stroke-width="28" stroke-dasharray="38 30"/>
    <path d="M 72.4 334.8 A 184 184 0 1 1 434.5 366.5" stroke-width="30" stroke-dasharray="50 38"/>
  </g>
  <path d="M 256.0 322.0 m -96 0 a 96 72 0 0 1 192 0 z" fill="#00fff9"/>
</svg>
